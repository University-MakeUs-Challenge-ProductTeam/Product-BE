<!DOCTYPE html>
<html>
<head>
    <title>실시간 채팅 테스트 - 사용자 1</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://unpkg.com/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        // STOMP 라이브러리 로드 확인
        window.addEventListener('load', function() {
            if (typeof Stomp !== 'undefined') {
                console.log('STOMP 라이브러리 로드 성공!');
            } else {
                console.error('STOMP 라이브러리 로드 실패!');
            }
        });
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .chat-container {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        .chat-header {
            background: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .my-message {
            align-items: flex-end;
        }
        .other-message {
            align-items: flex-start;
        }
        .message-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        .my-message .message-bubble {
            background: #28a745;
            color: white;
        }
        .other-message .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }
        .message-time {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .input-container {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }
        .message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            margin-right: 10px;
            outline: none;
        }
        .message-input:focus {
            border-color: #28a745;
        }
        .send-button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        .send-button:hover {
            background: #218838;
        }
        .status {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .user-info {
            background: #e2e3e5;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
        }
        .test-buttons {
            margin-bottom: 15px;
            text-align: center;
        }
        .test-button {
            padding: 8px 16px;
            margin: 0 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .test-button.clear {
            background: #dc3545;
            color: white;
        }
        .test-button.clear:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="user-info">
        <strong>현재 사용자:</strong> 중앙운영사무국 어드민 (ID: 1)<br>
        <strong>상대방:</strong> 중앙운영사무국 중앙 운영진 (ID: 2)
    </div>
    
    <div id="status" class="status disconnected">
        WebSocket 연결 중...
    </div>
    
    <div class="test-buttons">
        <button class="test-button clear" onclick="clearMessages()">메시지 초기화</button>
    </div>
    
    <div class="chat-container">
        <div class="chat-header">
            <h3>실시간 채팅 테스트 - 사용자 1</h3>
            <small>Kafka + WebSocket 기반 (실제 API)</small>
        </div>
        
        <div id="messages" class="messages">
            <div style="text-align: center; color: #666; margin-top: 20px;">
                채팅을 시작해보세요! 🚀
            </div>
        </div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="messageInput" 
                class="message-input"
                placeholder="메시지를 입력하세요..."
                disabled
            />
            <button id="sendButton" class="send-button" onclick="sendMessage()" disabled>
                전송
            </button>
        </div>
    </div>

    <script>
        // 설정 - 사용자 1로 변경 (실제 토큰 필요)
        const token = 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIiwibWVtYmVySWQiOiIxIiwicm9sZSI6IkFETUlOIiwiaWF0IjoxNzU0MDc0NjM2LCJleHAiOjE3NTUyODQyMzZ9.bRFFmjKw28la3J_0C73ZIDMTPtN5qesxB66wEBeU_Es'; // 사용자 1 실제 토큰
        const currentUserId = 1;
        const receiverId = 2;
        
        let stompClient = null;
        let messageCount = 0;
        
        // WebSocket 연결
        function connectWebSocket() {
            console.log('WebSocket 연결 시도 중...');
            const socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);
            
            // 연결 타임아웃 설정
            const connectTimeout = setTimeout(() => {
                console.error('WebSocket 연결 타임아웃');
                updateStatus('연결 타임아웃', false);
            }, 10000); // 10초 타임아웃
            
            stompClient.connect({}, function (frame) {
                clearTimeout(connectTimeout);
                console.log('WebSocket 연결됨!', frame);
                updateStatus('연결됨', true);
                enableInput();
                
                // 개인 메시지 구독
                stompClient.subscribe(`/topic/chat/${currentUserId}`, function (message) {
                    const chatMessage = JSON.parse(message.body);
                    displayMessage(chatMessage);
                });
                
                // 채팅방별 메시지 구독 제거 (중복 방지)
                // stompClient.subscribe('/topic/chat/room/1', function (message) {
                //     const chatMessage = JSON.parse(message.body);
                //     displayMessage(chatMessage);
                // });
                
            }, function(error) {
                clearTimeout(connectTimeout);
                console.error('WebSocket 연결 실패:', error);
                updateStatus('연결 실패', false);
                
                // 3초 후 재연결 시도
                setTimeout(() => {
                    console.log('WebSocket 재연결 시도...');
                    connectWebSocket();
                }, 3000);
            });
        }
        
        function updateStatus(message, connected) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = `WebSocket: ${message}`;
            statusDiv.className = `status ${connected ? 'connected' : 'disconnected'}`;
        }
        
        function enableInput() {
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
            document.getElementById('messageInput').focus();
        }
        
        function displayMessage(message) {
            const messagesDiv = document.getElementById('messages');
            
            // 초기 메시지 제거
            if (messageCount === 0) {
                messagesDiv.innerHTML = '';
            }
            
            const messageElement = document.createElement('div');
            messageElement.className = `message ${message.senderId === currentUserId ? 'my-message' : 'other-message'}`;
            
            const senderName = message.senderId === currentUserId ? '나' : '상대방';
            const time = new Date(message.createdAt).toLocaleTimeString();
            
            messageElement.innerHTML = `
                <div class="message-bubble">
                    ${message.content}
                </div>
                <div class="message-time">
                    ${senderName} • ${time}
                </div>
            `;
            
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            messageCount++;
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (content && stompClient) {
                fetch('http://localhost:8080/chats/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        receiverId: receiverId,
                        content: content,
                        messageType: 'TEXT'
                    })
                }).then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('메시지 전송 실패');
                    }
                }).then(data => {
                    console.log('메시지 전송 성공:', data);
                    input.value = '';
                    input.focus();
                }).catch(error => {
                    console.error('메시지 전송 오류:', error);
                    alert('메시지 전송에 실패했습니다. (토큰이 유효하지 않을 수 있습니다)');
                });
            }
        }
        
        function clearMessages() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div style="text-align: center; color: #666; margin-top: 20px;">채팅을 시작해보세요! 🚀</div>';
            messageCount = 0;
        }
        
        // Enter 키로 메시지 전송
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // 페이지 로드 시 WebSocket 연결
        window.onload = function() {
            connectWebSocket();
        };
        
        // 페이지 종료 시 연결 해제
        window.onbeforeunload = function() {
            if (stompClient) {
                stompClient.disconnect();
            }
        };
    </script>
</body>
</html>
